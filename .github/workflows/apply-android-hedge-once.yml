name: Apply Android live hedge patch once

on:
  push:
    branches:
      - live-research-android-v01
    paths:
      - '.github/workflows/apply-android-hedge-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_android_hedge_patch.py

      - name: Keep workflow files unchanged
        run: |
          git checkout HEAD -- .github/workflows/live-research-android.yml
          git checkout HEAD -- .github/workflows/apply-android-hedge-once.yml
          git checkout HEAD -- tools/apply_android_hedge_patch.py

      - name: Commit patched Android source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-research-android
          git diff --cached --check
          git commit -m "Add Android defensive live hedge v0.1.3.6"
          git push origin HEAD:live-research-android-v01
