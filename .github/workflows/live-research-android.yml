name: Build Live Research Android

on:
  push:
    branches:
      - live-research-android-v01
    paths:
      - 'live-research-android/**'
      - '.github/workflows/live-research-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and unsigned release APK
        working-directory: live-research-android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Align unsigned release APK
        run: |
          zipalign -f -p 4 \
            live-research-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            live-research-android/app/build/outputs/apk/release/LiveResearchAndroid-v0.1.1-aligned-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveResearchAndroid-v0.1.1-debug
          path: live-research-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload aligned unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveResearchAndroid-v0.1.1-aligned-unsigned
          path: live-research-android/app/build/outputs/apk/release/LiveResearchAndroid-v0.1.1-aligned-unsigned.apk
          if-no-files-found: error
