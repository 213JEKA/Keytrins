name: Build Multi-Exchange Android Terminal

on:
  push:
    branches:
      - codex/multi-exchange-terminal-v1
    paths:
      - 'multi-exchange-android-terminal/**'
      - '.github/workflows/multi-exchange-android-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build terminal APK
        working-directory: multi-exchange-android-terminal
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp multi-exchange-android-terminal/app/build/outputs/apk/debug/app-debug.apk Keytrins-Multi-Exchange-Terminal-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keytrins-Multi-Exchange-Terminal-v1.0.1
          path: Keytrins-Multi-Exchange-Terminal-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30
