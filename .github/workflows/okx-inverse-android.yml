name: Build OKX Inverse Android

on:
  push:
    branches:
      - live-research-android-v01
    paths:
      - 'okx-inverse-android/**'
      - '.github/workflows/okx-inverse-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and unsigned release APK
        working-directory: okx-inverse-android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify package and version
        run: |
          APK=okx-inverse-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -E "com.keytrins.okxinverse|versionCode|versionName" || true

      - name: Align unsigned release APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            okx-inverse-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-aligned-unsigned.apk

      - name: Restore private signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/live-research-signing.jks"

      - name: Sign release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/live-research-signing.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-signed.apk \
            okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-signed.apk
          sha256sum okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OKX-Inverse-v0.1.2-debug
          path: okx-inverse-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload aligned unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: OKX-Inverse-v0.1.2-aligned-unsigned
          path: okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-aligned-unsigned.apk
          if-no-files-found: error

      - name: Upload stable signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OKX-Inverse-v0.1.2-signed
          path: okx-inverse-android/app/build/outputs/apk/release/OKX-Inverse-v0.1.2-signed.apk
          if-no-files-found: error
