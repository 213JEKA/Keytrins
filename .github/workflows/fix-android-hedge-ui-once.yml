name: Fix Android hedge UI once

on:
  push:
    branches:
      - live-research-android-v01
    paths:
      - '.github/workflows/fix-android-hedge-ui-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix MainActivity strings
        run: python tools/fix_android_hedge_ui.py

      - name: Commit Android source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-research-android/app/src/main/java/com/keytrins/liveresearch/MainActivity.java
          git diff --cached --check
          git commit -m "Fix Android hedge dashboard strings"
          git push origin HEAD:live-research-android-v01
