name: Fix Android hedge v0.1.3.8 once

on:
  push:
    branches:
      - live-research-android-v01
    paths:
      - '.github/workflows/fix-android-hedge-v0138-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/fix_android_hedge_v0138.py
      - name: Commit Android source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-research-android
          git diff --cached --check
          git commit -m "Fix hedge execution reliability v0.1.3.8"
          git push origin HEAD:live-research-android-v01
